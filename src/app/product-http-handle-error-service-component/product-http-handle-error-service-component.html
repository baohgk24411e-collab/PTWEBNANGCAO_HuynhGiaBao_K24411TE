<p>product-list-call-service-component works!</p>
min_price:<input type="number" [(ngModel)]="min_price" />
max_price:<input type="number" [(ngModel)]="max_price" />
<button (click)="callFilterProductListByPrice()">
    Filter Products
</button>
<!-- Giải thuật cần phải đưa sản phẩm tới để hiển thị
 Trả về các sản phẩm tương đương
 1. Các sản phẩm trong khu vực (loại sản phẩm) mình tìm
 2. Sản phẩm bán chạy
 3. Sản phẩm mới nhất
 => Mảng sản phẩm của các mảng 
 => PHÁ CHUẨN MỰC-->
<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Image</th>
    </tr>
  </thead>
  <tbody>
    @for (product of products(); track product.id) {
    <tr>
      <td>{{ product.id }}</td>
      <td>{{ product.name }}</td>
      <td>{{ product.price | currency:'USD' }}</td>
      <td>  
        <img [src]="product.image_link" height="100" width="100"/>  
      </td>
    </tr>
} @empty {
    <tr>
        <td colspan="4">No products available.</td>
    </tr>
}     
  </tbody>
</table>
