<p>product-list-component works!</p>

<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Image</th>
    </tr>
  </thead>

  <tbody>
    @for (product of products(); track product.id) {
    <tr>
      <td>{{ product.id }}</td>
      <td>{{ product.name }}</td>
      <td>{{ product.price | currency:'USD' }}</td>
      <td>
        <img [src]="product.image_link" height="100" width="100"/>
      </td>
    </tr>
} @empty {
    <tr>
        <td colspan="4">No products available.</td>
    </tr>
}     
  </tbody>
</table>
